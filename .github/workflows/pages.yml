name: Deploy birthday invitation to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare versioned site
        run: |
          mkdir deploy
          cp -R site/. deploy/
          find deploy -type f \( -name '*.html' -o -name '*.json' \) -exec sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/g" {} +
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
